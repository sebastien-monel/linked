{% extends 'base.html' %}

{% block content %}
{% for item in urls %}
<a href="{{ item[0] }}">{{ item[1] }}</a> <br/>
{% endfor %}

<form method=post enctype=multipart/form-data>
  <input type=file name=file /> <br />
  <input type=text name=token placeholder="upload token" /> <br />
  <input type=submit value=Upload />
</form>
{% endblock %}
