{% extends 'base.html' %}

{% block content %}
<form method=post enctype=multipart/form-data>
  <input type=file name=file /> <br />
  <input type=text name=token placeholder="upload token" /> <br />
  <input type=submit value=Upload />
</form>

{% for item in urls %}
<a href="{{ item[0] }}" target="_blank">{{ item[1] }}</a> <br/>
{% endfor %}
{% endblock %}
